# tetris-esolang を静的に配信する nginx（コンテナの中。uid 10001 で動く。書けるのは /tmp だけ）。
# ホストの nginx（sagisawa-expose）は /tetris-esolang/... をそのままの URI でここへ渡す。
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 256;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	# アクセスログはホストの nginx が持つ
	access_log off;
	server_tokens off;
	sendfile on;
	client_body_temp_path /tmp/client_body;
	proxy_temp_path /tmp/proxy;
	fastcgi_temp_path /tmp/fastcgi;
	uwsgi_temp_path /tmp/uwsgi;
	scgi_temp_path /tmp/scgi;

	# ビルドのときに作った .gz を優先して返す。無いものはその場で圧縮する
	gzip_static on;
	gzip on;
	gzip_vary on;
	gzip_types text/css application/javascript application/json image/svg+xml;

	server {
		listen 3160;
		root /usr/share/nginx/html;
		# 転送は相対の Location で返す（コンテナの中のポートを外に見せない）
		absolute_redirect off;

		# 監視用（ゲートを通さない。秘密は返さない）
		location = /tetris-esolang/api/health {
			default_type application/json;
			add_header Cache-Control "no-store" always;
			return 200 '{"ok":true}';
		}
		location = /tetris-esolang {
			return 301 /tetris-esolang/;
		}
		# build.js・index.html は名前にハッシュが付かないので、毎回確認する（ETag）
		location /tetris-esolang/ {
			add_header Cache-Control "no-cache" always;
			try_files $uri $uri/ =404;
		}
		location / {
			return 404;
		}
	}
}
